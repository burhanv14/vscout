[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-contributor-agent"
version = "0.1.0"
description = "Autonomous CLI-driven open-source contributor agent powered by local OpenCode CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
]

[project.scripts]
agent = "oss_agent.cli:main"
