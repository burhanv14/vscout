# OSS-Contributor-Agent Configuration

# Your developer profile and matching tech stack
tech_stack:
  - python
  - fastapi
  - typescript
  - react

experience_level: "intermediate" # beginner | intermediate | advanced

# Target repository filters
preferred_labels:
  - "good first issue"
  - "help wanted"
  - "bug"
  - "documentation"
  - "docs"

min_repo_stars: 50
max_repo_stars: 25000
min_recent_activity_days: 30 # commit or active push within last N days

# Repositories or organizations to ignore
excluded_repos_or_orgs:
  - "kubernetes/kubernetes"

# Execution limits & thresholds
max_candidates_per_run: 5
worth_score_threshold: 65 # Drop issues evaluated below this score

# OpenCode Brain configuration
opencode:
  # Backend: 'cli' (shell out to `opencode run`) or 'server' (`opencode run --server <url>`)
  backend: "cli"
  server_url: "http://localhost:4096"
  # Model string format: provider/model#variant (leave empty to use OpenCode's default model)
  model: ""
  opencode_path: "" # Optional explicit path (auto-detects npm/pnpm/AppData/PATH if left empty)
  timeout_seconds: 180
  max_retries: 3

# Contributor identity
github:
  username: "burhanv14"
  # Path to gh binary if not in system PATH (e.g. C:\Program Files\GitHub CLI\bin\gh.exe or left empty for auto-detect)
  gh_path: ""
  # Use API directly if gh CLI is unavailable or fails authentication
  prefer_gh_cli: true

git:
  author_name: "Burhan Vora"
  author_email: "burhanvora14@gmail.com"
  # Path to git binary if not in system PATH (auto-detects C:\Program Files\Git\cmd\git.exe if empty)
  git_path: ""

# Sandbox execution for test running: 'auto' | 'docker' | 'venv'
sandbox:
  mode: "auto"
  timeout_seconds: 120
