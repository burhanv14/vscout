# OSS-Contributor-Agent Configuration

# Your developer profile and matching tech stack
tech_stack:
  - python
  - fastapi
  - typescript
  - react
  - java
  - go
  - rust

experience_level: "intermediate" # beginner | intermediate | advanced

# Target repository filters
preferred_labels:
  - "good first issue"
  - "help wanted"
  - "bug"
  - "documentation"
  - "docs"

min_repo_stars: 50
max_repo_stars: 25000

# GitHub token for API access (or set GITHUB_TOKEN env var)
github:
  token: ""
